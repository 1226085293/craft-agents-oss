appId: com.lukilabs.craft-agent
productName: Craft Agents
copyright: Copyright © 2026 Craft Docs Ltd.

electronVersion: "39.2.7"

# Hook to compile macOS 26+ Liquid Glass icon after packaging
afterPack: scripts/afterPack.cjs

# Top-level packager option (valid schema location). "maximum" = solid LZMA with
# the largest dictionary → smallest installer at the cost of a slower compression
# pass. This offsets the size cost of bundling the embedding runtime.
compression: maximum

# Only ship the Chromium locale packs we actually reach (en-US + zh-CN).
# Electron's default set is 55 packs ≈ 45 MB of locale .pak files that are never
# loadable by this app. Trimming them shrinks both win-unpacked and the NSIS
# compression input.
# NOTE: the schema key is `electronLanguages` (a top-level `languages` key is
# rejected with ValidationError).
electronLanguages:
  - en-US
  - zh-CN

directories:
  output: release
  buildResources: resources

# NOTE: electron-builder's minimatchAll is "last matching pattern wins".
  # All negative ("!") patterns MUST come after every positive pattern below,
  # otherwise a later positive glob (e.g. node_modules/**/*) re-includes
  # what an earlier "!" excluded (this silently shipped 111 MB of .map files).
files:
  - dist/**/*
  - package.json
  # Include bundled MCP servers (bridge + session) for Codex sessions
  - resources/bridge-mcp-server/**/*
  - resources/session-mcp-server/**/*
  # Include Pi agent server subprocess for Pi SDK sessions
  - resources/pi-agent-server/**/*
  # Note: Bundled assets (docs, themes, permissions, tool-icons) are in resources/
  # and copied to dist/resources/ by build:copy. They're included via dist/**/* above.
  # Include network interceptor for API error capture and MCP schema injection
  - packages/shared/src/unified-network-interceptor.ts
  - packages/shared/src/interceptor-common.ts
  - packages/shared/src/feature-flags.ts
  - packages/shared/src/interceptor-request-utils.ts
  # Include CLI tool Python scripts (platform-independent)
  - resources/scripts/**/*
  # Include CLI tool shell wrappers (platform-independent, both Unix and Windows)
  - resources/bin/markitdown
  - resources/bin/markitdown.cmd
  - resources/bin/pdf-tool
  - resources/bin/pdf-tool.cmd
  - resources/bin/xlsx-tool
  - resources/bin/xlsx-tool.cmd
  - resources/bin/doc-diff
  - resources/bin/doc-diff.cmd
  - resources/bin/img-tool
  - resources/bin/img-tool.cmd
  - resources/bin/docx-tool
  - resources/bin/docx-tool.cmd
  - resources/bin/pptx-tool
  - resources/bin/pptx-tool.cmd
  - resources/bin/ical-tool
  - resources/bin/ical-tool.cmd
  # Include bundled uv binary (platform-specific, only the relevant one ships per build)
  - resources/bin/darwin-arm64/**/*
  - resources/bin/darwin-x64/**/*
  - resources/bin/win32-x64/**/*
  - resources/bin/linux-x64/**/*
  # Include bundled Bun runtime (platform-specific, set by build script)
  - vendor/bun/**/*
  # Exclude nothing — npm module collector fills node_modules from the
  # dependency tree (declared in this package.json). The explicit exclusion
  # below is removed because electron-builder 26 treats a `files` whitelist
  # as authoritative and would otherwise drop every dependency (filesCount=0).
  # node_modules/**/*
  - "node_modules/**/*"
  # ------------------------------------------------------------------
  # Exclusions — MUST stay at the END of this list (last-match-wins).
  # ------------------------------------------------------------------
  # Never ship source maps (vite sourcemap:true + npm packages) — 150 MB dead weight.
  - "!**/*.map"
  # Never ship the stray "~" dir (old home-dir copies leak session transcripts).
  - "!~/**/*"
  - "!dist/renderer/src/**"
  # Never ship dev-only source/config that is not needed at runtime.
  - "!src/**/*"
  - "!scripts/**/*"
  - "!eslint-rules/**/*"
  - "!build/**/*"
  - "!vite.config.ts"
  - "!tsconfig.json"
  - "!components.json"
  - "!eslint.config.mjs"
  - "!README.md"
  # SDK ships a thin core + per-platform binary pkg. On Windows only the
  # target arch (x64) is needed; drop the other platform packages (~208 MB
  # of duplicate claude.exe). The runtime resolver checks the stable
  # claude-agent-sdk-binary alias first (runtime-resolver.ts), which is
  # staged by build-win.ps1, so these are pure duplicates.
  - "!node_modules/@anthropic-ai/claude-agent-sdk-win32-x64/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-darwin*/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-linux*/**"

# Since SDK 0.2.113 the SDK ships a thin core (`@anthropic-ai/claude-agent-sdk`)
# and a per-platform optional dependency (`-darwin-arm64`, `-darwin-x64`, etc.)
# containing the ~210 MB native `claude` binary. We bundle both as extraResources
# below — only the binary matching the build target is shipped per artifact, so
# the platform `files` rules below also exclude the wrong-platform binaries.
#
# Why extraResources instead of `files`: since electron-builder v20.15.2,
# `node_modules` directories are auto-excluded from `files`. extraResources
# bypasses that. See: https://github.com/electron-userland/electron-builder/issues/3104
#
# Ripgrep is sourced from `@vscode/ripgrep` (was previously bundled inside the
# SDK as `vendor/ripgrep/<platform>/rg`; removed in 0.2.113).

extraMetadata:
  main: dist/main.cjs

# Auto-update: electron-updater fetches update manifests from GitHub Releases
publish:
  provider: github
  owner: 1226085293
  repo: craft-agents-oss

# Re-enable ASAR: collapses ~43k loose files into one archive, which makes
# the electron-builder copy/collect stage far faster (the previous asar:false
# shipped a ~2.2 GB loose tree). asarUnpack below keeps everything that must
# be a real file on disk (native binaries, executables, ONNX runtime/model,
# Bun/uv, subprocess entry points).
asar: true
# Files that MUST be real paths at runtime are unpacked out of app.asar.
asarUnpack:
  # Native Anthropic SDK binary (claude.exe) — spawned as a subprocess.
  - "**/node_modules/@anthropic-ai/**"
  # onnxruntime native bindings + bundled embedding model.
  - "**/node_modules/onnxruntime-node/**"
  - "**/node_modules/onnxruntime-web/**"
  - "**/node_modules/@img/sharp*/**"
  - "**/resources/models/**"
  # koffi native FFI libs.
  - "**/node_modules/koffi/**"
  # ------------------------------------------------------------------
  # Subprocess entry points. These are passed as ARGUMENTS to an external
  # bun.exe / node.exe spawn (pi-agent.ts), which CANNOT read inside
  # app.asar — they must be real files on disk.
  #   - packages/shared/src/agent/pi-agent.ts:1605 spawns bun with
  #     [piServerPath] and `--preload <interceptorPath>`
  #   - runtime-resolver.ts resolveServerPath() returns dist/resources/<name>/index.js
  # ------------------------------------------------------------------
  - "**/dist/resources/pi-agent-server/**"
  - "**/dist/resources/session-mcp-server/**"
  - "**/dist/resources/bridge-mcp-server/**"
  - "**/dist/interceptor.cjs"
  # CLI tool wrappers + Python scripts are exposed to agent Bash sessions via
  # PATH prepend and CRAFT_SCRIPTS (apps/electron/src/main/index.ts:144-178),
  # then executed by an EXTERNAL shell / `uv run` — they cannot live in asar.
  - "**/dist/resources/bin/**"
  - "**/dist/resources/scripts/**"
  # Bundled docs (e.g. CRAFT_COMMANDS_DOC_PATH) are opened by the agent from
  # its own subprocess, which cannot read inside app.asar.
  - "**/dist/resources/docs/**"

mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  # macOS 26+ Liquid Glass: Tell macOS to look for icon in Assets.car
  # The value must match --app-icon used in actool (see afterPack.js)
  extendInfo:
    CFBundleIconName: AppIcon
    # Required for macOS to list the app under Privacy & Security > Local Network
    # and prompt for permission. Without it the app is silently denied LAN access
    # and never appears in the privacy pane (craft-agents-oss#938).
    NSLocalNetworkUsageDescription: "Craft Agents uses your local network to reach LAN addresses and devices you ask an agent to access, such as local servers or APIs."
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    # Thin core SDK (sdk.mjs + types). ~4 MB — present on every platform.
    - from: node_modules/@anthropic-ai/claude-agent-sdk
      to: app/node_modules/@anthropic-ai/claude-agent-sdk
    # Stable alias pointing at the target-arch native binary package.
    # Populated by build-dmg.sh / build-linux.sh / build-win.ps1 before
    # electron-builder runs (`apps/electron/node_modules/@anthropic-ai/claude-agent-sdk-binary/`).
    # The runtime resolver (runtime-resolver.ts) looks here first.
    - from: node_modules/@anthropic-ai/claude-agent-sdk-binary
      to: app/node_modules/@anthropic-ai/claude-agent-sdk-binary
    # ripgrep (used by packages/server-core/src/services/search.ts).
    - from: node_modules/@vscode/ripgrep
      to: app/node_modules/@vscode/ripgrep
    # Memory embedding engine (bge-small-zh-v1.5): transformers.js runtime +
    # its ONNX wasm kernels + deps (jinja/tokenizers/sharp native). Bun
    # hoists npm deps to the repo-root node_modules, so `from` must point
    # there (../../ from apps/electron) — the local node_modules copy may
    # not exist in a fresh checkout.
    - from: E:/craft-agents-oss/node_modules/@huggingface/transformers
      to: app/node_modules/@huggingface/transformers
    - from: E:/craft-agents-oss/node_modules/@huggingface/jinja
      to: app/node_modules/@huggingface/jinja
    - from: E:/craft-agents-oss/node_modules/@huggingface/tokenizers
      to: app/node_modules/@huggingface/tokenizers
    - from: E:/craft-agents-oss/node_modules/onnxruntime-web
      to: app/node_modules/onnxruntime-web
    - from: E:/craft-agents-oss/node_modules/onnxruntime-node
      to: app/node_modules/onnxruntime-node
    - from: E:/craft-agents-oss/node_modules/onnxruntime-common
      to: app/node_modules/onnxruntime-common
    - from: E:/craft-agents-oss/node_modules/sharp
      to: app/node_modules/sharp
    # WhatsApp worker subprocess (self-contained; Baileys bundled in).
    - from: ../../packages/messaging-whatsapp-worker/dist/worker.cjs
      to: messaging-whatsapp-worker/worker.cjs
  # Exclude binaries for other platforms
  files:
    - "!**/resources/bin/win32-*/**"
    - "!**/resources/bin/linux-*/**"
  # Use predictable naming for macOS packages (applies to zip; dmg uses its own config below)
  artifactName: "Craft-Agents-${arch}.${ext}"
  # Code signing & notarization (disabled by default for local builds)
  # To enable: set CSC_LINK, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
  # notarize:
  #   teamId: ${APPLE_TEAM_ID}

dmg:
  # Use predictable naming: Craft-Agents-arm64.dmg, Craft-Agents-x64.dmg
  artifactName: "Craft-Agents-${arch}.dmg"
  # Custom background (multi-resolution TIFF with 1x+2x for retina support)
  background: resources/dmg-background.tiff
  # Use app icon as the mounted volume icon in Finder
  icon: resources/icon.icns
  iconSize: 80
  title: "Craft Agents"
  contents:
    - x: 130
      y: 200
    - x: 410
      y: 200
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

win:
  icon: resources/icon.ico
  # Local/dev builds are intentionally unsigned. This also avoids downloading
  # winCodeSign, whose archive contains symlinks that fail to extract on
  # Windows without developer-mode/admin privileges.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  # Use predictable naming: Craft-Agents-x64.exe
  artifactName: "Craft-Agents-${arch}.${ext}"
  files:
    # Exclude binaries for other platforms
    - "!**/resources/bin/darwin-*/**"
    - "!**/resources/bin/linux-*/**"
    # WORKAROUND: Exclude bun and uv from regular files on Windows.
    # electron-builder's npm node module collector causes EBUSY errors when copying
    # .exe files because it scans/locks files while simultaneously trying to copy them.
    # Moving them to extraResources avoids this by copying before the collector runs.
    # See: https://github.com/electron-userland/electron-builder/issues/8250
    - "!vendor/bun/**/*"
    - "!**/resources/bin/win32-x64/**"
    # ------------------------------------------------------------------
    # Exclusions — MUST stay at the END of this list (last-match-wins).
    # ------------------------------------------------------------------
    # copy-assets.ts copies resources/ -> dist/resources/, so uv.exe exists in BOTH
    # dist/resources/bin/win32-x64/ (via dist/**/*) and resources/bin/win32-x64
    # (via the extraResources copy below). The main process resolves
    # <resources>/app/resources/bin/win32-x64/uv.exe (apps/electron/src/main/index.ts),
    # so the dist copy is 57 MB of pure duplicate. Keep the extraResources one.
    - "!dist/resources/bin/win32-x64/**"
    # onnxruntime-node ships native binaries for every platform (~288 MB total).
    # The Electron main process only loads win32/x64. Exclude the rest.
    - "!node_modules/onnxruntime-node/bin/napi-v6/darwin*/**"
    - "!node_modules/onnxruntime-node/bin/napi-v6/linux*/**"
    - "!node_modules/onnxruntime-node/bin/napi-v6/win32-arm64/**"
    # Re-assert source-map exclusion for the win target (parity with root `files`;
    # platform-specific `files` are merged, so keep it last to win).
    - "!**/*.map"
  # Copy executables as extraResources to avoid EBUSY file locking (see comment above)
  extraResources:
    - from: node_modules/@anthropic-ai/claude-agent-sdk
      to: app/node_modules/@anthropic-ai/claude-agent-sdk
    - from: node_modules/@anthropic-ai/claude-agent-sdk-binary
      to: app/node_modules/@anthropic-ai/claude-agent-sdk-binary
    - from: node_modules/@vscode/ripgrep
      to: app/node_modules/@vscode/ripgrep
    - from: vendor/bun/bun.exe
      to: vendor/bun/bun.exe
    - from: resources/bin/win32-x64
      to: app/resources/bin/win32-x64
    # Embedding runtime fix (2026-10-13): onnxruntime-common is the shared
    # transitive dep that @huggingface/transformers's node build imports
    # directly, but electron-builder's npm collector (bun monorepo hoisting)
    # does NOT recurse into it — so it must be copied explicitly. Without it
    # the embedding engine fails with ERR_MODULE_NOT_FOUND at runtime.
    # (transformers/jinja/tokenizers/onnxruntime-node/web/sharp are already
    # collected as declared deps via the files whitelist.)
    - from: E:/craft-agents-oss/node_modules/onnxruntime-common
      to: app/node_modules/onnxruntime-common
    # WhatsApp worker subprocess (self-contained; Baileys bundled in).
    - from: ../../packages/messaging-whatsapp-worker/dist/worker.cjs
      to: messaging-whatsapp-worker/worker.cjs

nsis:
  oneClick: true
  # Per-user install to %LOCALAPPDATA%\Programs\ (not Program Files).
  # Bun subprocess cannot read/write files in Program Files due to Windows permissions.
  perMachine: false
  deleteAppDataOnUninstall: true
  # Ship a single-arch installer whose embedded app archive uses SOLID
  # compression. electron-builder's default (`differentialPackage` enabled)
  # forces solid=false + dictSize=1MB so the auto-updater can build small
  # differential downloads — but that roughly doubles the installer size
  # (~268 MB -> ~570 MB measured 2026-10-16) and makes the 7z stage the
  # dominant build cost (~7 min). Local/self-hosted builds value size and
  # build time over differential update traffic.
  differentialPackage: false
  # Only bundle the locales we actually ship UI for (en-US + zh-CN).
  # Chromium's default 55 packs cost ~45 MB and are never reachable.
  # Values are locale codes (mapped to NSIS language names: en_US->English,
  # zh_CN->SimpChinese); display names are rejected by electron-builder.
  installerLanguages:
    - en_US
    - zh_CN

linux:
  icon: resources/icon.png
  category: Utility
  maintainer: "Craft Docs Ltd. <support@craft.do>"
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: "Craft-Agents-${arch}.${ext}"
  extraResources:
    - from: node_modules/@anthropic-ai/claude-agent-sdk
      to: app/node_modules/@anthropic-ai/claude-agent-sdk
    - from: node_modules/@anthropic-ai/claude-agent-sdk-binary
      to: app/node_modules/@anthropic-ai/claude-agent-sdk-binary
    - from: node_modules/@vscode/ripgrep
      to: app/node_modules/@vscode/ripgrep
    # WhatsApp worker subprocess (self-contained; Baileys bundled in).
    - from: ../../packages/messaging-whatsapp-worker/dist/worker.cjs
      to: messaging-whatsapp-worker/worker.cjs
  # Exclude binaries for other platforms
  files:
    - "!**/resources/bin/darwin-*/**"
    - "!**/resources/bin/win32-*/**"
